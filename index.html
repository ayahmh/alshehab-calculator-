<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شركة الشهاب</title>

<style>

body{
    font-family: Arial;

    background: url("hh.jpg") no-repeat center center fixed;
    background-size: cover;

    display:flex;
    justify-content:flex-start;
    align-items:center;

    height:100vh;
    margin:0;

    padding-right:500px;

    direction: rtl;
    text-align: right;
}

.container{

    background: rgba(255,255,255,0.3);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    width:350px;

    padding:30px;

    border-radius:15px;

    box-shadow:0 0 15px rgba(0,0,0,0.2);
    
    max-height: 90vh;
    overflow-y: auto;
}

h2{
    text-align:center;
    color:black;
}

label{
    color:black;
    display: block;
    margin-top: 10px;
}

input, select{

    width:100%;

    padding:12px;

    margin-top:10px;

    border-radius:8px;

    background: rgba(255,255,255,0.1);

    color:black;

    border:1px solid rgba(255,255,255,0.3);

    box-sizing:border-box;
}

select option{
    background:#222;
    color:white;
}

button{

    width:100%;

    padding:12px;

    margin-top:15px;

    background:#007bff;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;
}

.btn-secondary {
    background: #6c757d;
}

.btn-success {
    background: #28a745;
}

.btn-danger {
    background: #dc3545;
    padding: 6px 12px;
    margin-top: 5px;
    width: auto;
    font-size: 12px;
}

.result{

    margin-top:15px;

    padding:12px;

    background: rgba(255,255,255,0.1);

    border-radius:10px;

    color:black;
}

.admin-panel {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 10px;
    border: 1px solid #ccc;
}

.admin-car-section {
    margin-bottom: 15px;
    border-bottom: 1px dashed #444;
    padding-bottom: 10px;
}

.admin-car-section h4 {
    margin: 5px 0;
    color: #111;
}

.add-car-box {
    background: rgba(0, 123, 255, 0.1);
    padding: 10px;
    border-radius: 8px;
    margin-top: 15px;
    border: 1px solid rgba(0, 123, 255, 0.3);
}

/* التعديل الجديد لإصلاح التناسب مع شاشات الهواتف */
@media (max-width: 768px) {
    body {
        padding-right: 0px;
        justify-content: center; /* تجعل المربع في منتصف الشاشة على الهاتف */
    }
    .container {
        width: 90%; /* تجعل المربع مرن ليتناسب مع أحجام الهواتف المختلفة */
        margin: 20px auto;
    }
}

</style>
</head>

<body>

<div class="container" id="mainContainer">

    <h2>حاسبة المرابحة الاسلامية</h2>

    <div id="calculatorForm">
        <label>الراتب</label>
        <input type="number" id="salary" step="0.01">

        <label>المؤسسة</label>
        <select id="org">
            <option value="2">مكافحة الفساد</option>
            <option value="2">مصلحة الجمارك</option>
            <option value="2">المدعي العام العسكري</option>
            <option value="2">الشركة الوطنية للنقل البحري</option>
            <option value="2">المحكمة العليا</option>
            <option value="2">المنطقة الحرة مصراتة</option>
            <option value="2">النقابة العامة للمعلمين</option>
            <option value="2">التعليم العالي</option>
            <option value="2">شركة الواحة للنفط</option>
            <option value="2">الحرس البلدي</option>
            <option value="2">المجلس الوطني للحقوق</option>
            <option value="2">رقابة الأغذية</option>
            <option value="2">جمعية الدعوة الإسلامية</option>
            <option value="2">الداخلية</option>
            <option value="2">وزارة الزراعة</option>
            <option value="2">خطوط أفريقية</option>
            <option value="2">معهد النفط</option>
            <option value="2">هاتف ليبيا</option>
            <option value="2">مركز بحوث النفط</option>
            <option value="2">شركة حفر الآبار النفطية</option>
            <option value="2">أكاكوس للعمليات النفطية</option>
            <option value="2">شركة سرت للنفط</option>
            <option value="2">شركة لاريكو للنفط</option>
            <option value="2">شركة زويتينة للنفط</option>
            <option value="2">القضاء العسكري</option>
            <option value="2">قناة ليبيا الوطنية</option>
            <option value="2">حرس المنشآت النفطية</option>
            <option value="3">غير ذلك</option>
        </select>

        <label>نوع السيارة</label>
        <select id="car">
            </select>

        <button onclick="calculate()">
            احسب
        </button>

        <button class="btn-secondary" onclick="toggleAdminPanel()">
            تعديل الأسعار والسيارات
        </button>

        <div class="result" id="resultBox"></div>

        <div id="optionsBox"></div>

        <button id="submitBtn" onclick="finalCalculate()" style="display:none;">
            تأكيد
        </button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h3>تعديل الأسعار والسيارات</h3>
        
        <div id="adminCarsList"></div>
        
        <div class="add-car-box">
            <h4>➕ إضافة سيارة جديدة</h4>
            <label>اسم السيارة:</label>
            <input type="text" id="new_car_name" placeholder="مثال: هيونداي توسان">
            <label>السعر الأساسي:</label>
            <input type="number" id="new_car_base" placeholder="مثال: 150000">
            <label>سعر التسكيرة:</label>
            <input type="number" id="new_car_cash" placeholder="مثال: 120000">
            <button class="btn-success" style="margin-top:10px; padding:8px;" onclick="addNewCarToList()">إدراج السيارة في القائمة</button>
        </div>

        <hr style="margin-top:20px;">
        <button class="btn-success" onclick="saveNewPrices()">حفظ التغييرات النهائية</button>
        <button class="btn-secondary" onclick="toggleAdminPanel()">إلغاء</button>
    </div>

</div>

<script>

// الأسعار الافتراضية الأساسية
const defaultCars = {
    urbanCruiser: {
        name: "تويوتا أوربان كروزر",
        basePrice: 135000,
        cashAdd: 115000
    },
    stargazer: {
        name: "هيونداي ستارجيزر",
        basePrice: 94900,
        cashAdd: 65000
    },
    cretaFull: {
        name: "هيونداي كريتا فل",
        basePrice: 128000,
        cashAdd: 110000
    },
    cretaMid: {
        name: "هيونداي كريتا نص",
        basePrice: 120000,
        cashAdd: 100000
    }
};

// تحميل البيانات أو استخدام الافتراضية
let cars = JSON.parse(localStorage.getItem('shihab_cars_prices')) || defaultCars;

// للتأكد من وجود السيارات الأساسية دائماً
for (let key in defaultCars) {
    if (!cars[key]) {
        cars[key] = defaultCars[key];
    }
}

function updateCarSelectOptions() {
    let carSelect = document.getElementById("car");
    carSelect.innerHTML = "";
    for (let key in cars) {
        let opt = document.createElement("option");
        opt.value = key;
        opt.textContent = cars[key].name;
        carSelect.appendChild(opt);
    }
}

updateCarSelectOptions();

function calculate(){

    let salary =
        parseFloat(document.getElementById("salary").value) || 0;

    let box =
        document.getElementById("resultBox");

    let optionsBox =
        document.getElementById("optionsBox");

    let submitBtn =
        document.getElementById("submitBtn");

    optionsBox.innerHTML = "";
    submitBtn.style.display = "none";
    box.innerHTML = "";

    if(salary <= 2500){

        optionsBox.innerHTML = `
            <div class="result">

                <strong>عدد السنوات:</strong><br><br>

                <label>
                    <input type="radio" name="years" value="8" checked>
                    8 سنوات (افتراضي)
                </label>

            </div>
        `;

        submitBtn.style.display = "block";
        return;
    }

    let halfSalary = salary / 2;
    let possibleYears = [];

    for(let y = 8; y >= 1; y--){

        let threshold = 120000 / (y * 12);

        if(halfSalary >= threshold){
            possibleYears.push(y);
        }
    }

    if(possibleYears.length === 0){
        box.innerHTML = "لا توجد خيارات متاحة لهذا الراتب.";
        return;
    }

    let html =
        "<div class='result'><strong>اختر عدد السنوات:</strong><br>";

    possibleYears.forEach(y => {

        html += `
            <label>
                <input type="radio" name="years" value="${y}">
                ${y} سنوات
            </label><br>
        `;
    });

    html += "</div>";

    optionsBox.innerHTML = html;
    submitBtn.style.display = "block";
}

function finalCalculate(){

    let container =
        document.getElementById("mainContainer");

    let salary =
        parseFloat(document.getElementById("salary").value) || 0;

    let orgType =
        parseFloat(document.getElementById("org").value);

    let selectedYears =
        document.querySelector('input[name="years"]:checked');

    let carKey =
        document.getElementById("car").value;

    let car = cars[carKey];

    if(!selectedYears){

        document.getElementById("resultBox").innerHTML =
            "اختر عدد السنوات أولاً";

        return;
    }

    let years = parseInt(selectedYears.value);

    let feeRate =
        (orgType === 3) ? 0.03 : 0.02;

    let carPrice =
        car.basePrice +
        (car.basePrice * feeRate * years);

    let monthly, totalPayment, result;

    if(salary <= 2500){

        monthly = salary / 2;
        totalPayment = monthly * 96;

        result =
            (totalPayment - carPrice)
            + car.cashAdd;

    } else {

        monthly = 120000 / (years * 12);
        totalPayment = monthly * (years * 12);

        result =
            120000 - carPrice + car.cashAdd;
    }

    container.innerHTML = `

        <h2>ملخص التمويل</h2>

        <div class="result">

            <p><strong>السيارة:</strong> ${car.name}</p>

            <p><strong>الراتب:</strong> ${salary.toLocaleString()}</p>

            <p><strong>القسط الشهري:</strong>
            ${monthly.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
            </p>

            <p><strong>عدد السنوات:</strong> ${years}</p>

            <p><strong>إجمالي الدفع:</strong> ${totalPayment.toLocaleString()}</p>

            <p><strong>نسبة الرسوم:</strong> ${feeRate * 100}%</p>

            <p><strong>سعر السيارة:</strong> ${car.basePrice.toLocaleString()}</p>

            <p><strong>السعر بعد الرسوم:</strong>
            ${carPrice.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
            </p>

            <p><strong>سعر التسكيرة:</strong>
            ${car.cashAdd.toLocaleString()}
            </p>

            <p><strong>المبلغ النهائي:</strong>
            ${result.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
            </p>

            <hr>

            <p><strong>الدفعة الأولى:</strong><br>
            ${(totalPayment - carPrice).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
            </p>

        </div>

        <button onclick="location.reload()">
            حساب جديد
        </button>

    `;
}

function toggleAdminPanel() {
    let form = document.getElementById("calculatorForm");
    let panel = document.getElementById("adminPanel");
    
    if (panel.style.display === "block") {
        panel.style.display = "none";
        form.style.display = "block";
    } else {
        form.style.display = "none";
        panel.style.display = "block";
        renderAdminCars();
    }
}

function renderAdminCars() {
    let listContainer = document.getElementById("adminCarsList");
    listContainer.innerHTML = "";
    
    for (let key in cars) {
        listContainer.innerHTML += `
            <div class="admin-car-section" id="section_${key}">
                <h4>${cars[key].name}</h4>
                <label>السعر الأساسي:</label>
                <input type="number" id="admin_base_${key}" value="${cars[key].basePrice}">
                <label>سعر التسكيرة:</label>
                <input type="number" id="admin_cash_${key}" value="${cars[key].cashAdd}">
                <button class="btn-danger" onclick="deleteCar('${key}')">حذف هذه السيارة</button>
            </div>
        `;
    }
}

function addNewCarToList() {
    let name = document.getElementById("new_car_name").value.trim();
    let base = parseFloat(document.getElementById("new_car_base").value);
    let cash = parseFloat(document.getElementById("new_car_cash").value);
    
    if(!name || isNaN(base) || isNaN(cash)) {
        alert("الرجاء ملء جميع حقول السيارة الجديدة بشكل صحيح!");
        return;
    }
    
    let key = "car_" + Date.now();
    
    cars[key] = {
        name: name,
        basePrice: base,
        cashAdd: cash
    };
    
    document.getElementById("new_car_name").value = "";
    document.getElementById("new_car_base").value = "";
    document.getElementById("new_car_cash").value = "";
    
    renderAdminCars();
}

function deleteCar(key) {
    if(confirm(`هل أنت متأكد من حذف سيارة (${cars[key].name})؟`)) {
        delete cars[key];
        renderAdminCars();
    }
}

function saveNewPrices() {
    for (let key in cars) {
        let inputBase = document.getElementById(`admin_base_${key}`);
        let inputCash = document.getElementById(`admin_cash_${key}`);
        
        if(inputBase && inputCash) {
            let newBase = parseFloat(inputBase.value);
            let newCash = parseFloat(inputCash.value);
            
            if (!isNaN(newBase)) cars[key].basePrice = newBase;
            if (!isNaN(newCash)) cars[key].cashAdd = newCash;
        }
    }
    
    localStorage.setItem('shihab_cars_prices', JSON.stringify(cars));
    updateCarSelectOptions();
    alert("تم حفظ جميع التغييرات بنجاح!");
    toggleAdminPanel();
}

</script>

</body>
</html>
