<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شركة الشهاب</title>

<style>

body{
    font-family: Arial;

    background: url("hh.jpg") no-repeat center center fixed;
    background-size: cover;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
    margin:0;

    padding-right:20px;

    direction: rtl;
    text-align: right;
}

.container{

    background: rgba(255,255,255,0.3);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    width:350px;

    padding:30px;

    border-radius:15px;

    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:black;
}

label{
    color:black;
}

input, select{

    width:100%;

    padding:12px;

    margin-top:10px;

    border-radius:8px;

    background: rgba(255,255,255,0.1);

    color:black;

    border:1px solid rgba(255,255,255,0.3);

    box-sizing:border-box;
}

select option{
    background:#222;
    color:white;
}

button{

    width:100%;

    padding:12px;

    margin-top:15px;

    background:#007bff;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;
}

.result{

    margin-top:15px;

    padding:12px;

    background: rgba(255,255,255,0.1);

    border-radius:10px;

    color:black;
}
@media (max-width: 768px) {
    .container {
        width: 90%;
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>حاسبة المرابحة الاسلامية</h2>

    <label>الراتب</label>
    <input type="number" id="salary" step="0.01">

    <label>المؤسسة</label>
    <select id="org">

        <option value="2">مكافحة الفساد</option>
        <option value="2">مصلحة الجمارك</option>
        <option value="2">المدعي العام العسكري</option>
        <option value="2">الشركة الوطنية للنقل البحري</option>
        <option value="2">المحكمة العليا</option>
        <option value="2">المنطقة الحرة مصراتة</option>
        <option value="2">النقابة العامة للمعلمين</option>
        <option value="2">التعليم العالي</option>
        <option value="2">شركة الواحة للنفط</option>
        <option value="2">الحرس البلدي</option>
        <option value="2">المجلس الوطني للحقوق</option>
        <option value="2">رقابة الأغذية</option>
        <option value="2">جمعية الدعوة الإسلامية</option>
        <option value="2">الداخلية</option>
        <option value="2">وزارة الزراعة</option>
        <option value="2">خطوط أفريقية</option>
        <option value="2">معهد النفط</option>
        <option value="2">هاتف ليبيا</option>
        <option value="2">مركز بحوث النفط</option>
        <option value="2">شركة حفر الآبار النفطية</option>
        <option value="2">أكاكوس للعمليات النفطية</option>
        <option value="2">شركة سرت للنفط</option>
        <option value="2">شركة لاريكو للنفط</option>
        <option value="2">شركة زويتينة للنفط</option>
        <option value="2">القضاء العسكري</option>
        <option value="2">قناة ليبيا الوطنية</option>
        <option value="2">حرس المنشآت النفطية</option>
        <option value="3">غير ذلك</option>

    </select>

    <label>نوع السيارة</label>
    <select id="car">

        <option value="urbanCruiser">
            تويوتا أوربان كروزر
        </option>

        <option value="creta">
            هيونداي كريتا
        </option>

    </select>

    <button onclick="calculate()">
        احسب
    </button>

    <div class="result" id="resultBox"></div>

    <div id="optionsBox"></div>

    <button id="submitBtn" onclick="finalCalculate()" style="display:none;">
        تأكيد
    </button>

</div>

<script>

const cars = {

    urbanCruiser:{
        name:"تويوتا أوربان كروزر",
        basePrice:135000,
        cashAdd:115000
    },

    creta:{
        name:"هيونداي كريتا",
        basePrice:120000,
        cashAdd:95000
    }
};

function calculate(){

    let salary =
        parseFloat(document.getElementById("salary").value) || 0;

    let box =
        document.getElementById("resultBox");

    let optionsBox =
        document.getElementById("optionsBox");

    let submitBtn =
        document.getElementById("submitBtn");

    optionsBox.innerHTML = "";
    submitBtn.style.display = "none";
    box.innerHTML = "";

    if(salary <= 2500){

        optionsBox.innerHTML = `
            <div class="result">

                <strong>عدد السنوات:</strong><br><br>

                <label>
                    <input type="radio" name="years" value="8" checked>
                    8 سنوات (افتراضي)
                </label>

            </div>
        `;

        submitBtn.style.display = "block";
        return;
    }

    let halfSalary = salary / 2;
    let possibleYears = [];

    for(let y = 8; y >= 1; y--){

        let threshold = 120000 / (y * 12);

        if(halfSalary >= threshold){
            possibleYears.push(y);
        }
    }

    if(possibleYears.length === 0){
        box.innerHTML = "لا توجد خيارات متاحة لهذا الراتب.";
        return;
    }

    let html =
        "<div class='result'><strong>اختر عدد السنوات:</strong><br>";

    possibleYears.forEach(y => {

        html += `
            <label>
                <input type="radio" name="years" value="${y}">
                ${y} سنوات
            </label><br>
        `;
    });

    html += "</div>";

    optionsBox.innerHTML = html;
    submitBtn.style.display = "block";
}

function finalCalculate(){

    let container =
        document.querySelector(".container");

    let salary =
        parseFloat(document.getElementById("salary").value) || 0;

    let orgType =
        parseFloat(document.getElementById("org").value);

    let selectedYears =
        document.querySelector('input[name="years"]:checked');

    let carKey =
        document.getElementById("car").value;

    let car = cars[carKey];

    if(!selectedYears){

        document.getElementById("resultBox").innerHTML =
            "اختر عدد السنوات أولاً";

        return;
    }

    let years = parseInt(selectedYears.value);

    let feeRate =
        (orgType === 3) ? 0.03 : 0.02;

    let carPrice =
        car.basePrice +
        (car.basePrice * feeRate * years);

    let monthly, totalPayment, result;

    if(salary <= 2500){

        monthly = salary / 2;
        totalPayment = monthly * 96;

        result =
            (totalPayment - carPrice)
            + car.cashAdd;

    } else {

        monthly = 120000 / (years * 12);
        totalPayment = monthly * (years * 12);

        result =
            120000 - carPrice + car.cashAdd;
    }

    container.innerHTML = `

        <h2>ملخص التمويل</h2>

        <div class="result">

            <p><strong>السيارة:</strong> ${car.name}</p>

            <p><strong>الراتب:</strong> ${salary.toLocaleString()}</p>

            <p><strong>القسط الشهري:</strong>
            ${monthly.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
            </p>

            <p><strong>عدد السنوات:</strong> ${years}</p>

            <p><strong>إجمالي الدفع:</strong> ${totalPayment.toLocaleString()}</p>

            <p><strong>نسبة الرسوم:</strong> ${feeRate * 100}%</p>

            <p><strong>سعر السيارة:</strong> ${car.basePrice.toLocaleString()}</p>

            <p><strong>السعر بعد الرسوم:</strong>
            ${carPrice.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
            </p>

            <p><strong>سعر التسكيرة:</strong>
            ${car.cashAdd.toLocaleString()}
            </p>

            <p><strong>المبلغ النهائي:</strong>
            ${result.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
            </p>

            <hr>

            <p><strong>الدفعة الأولى:</strong><br>
            ${(totalPayment - carPrice).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
            </p>

        </div>

        <button onclick="location.reload()">
            حساب جديد
        </button>

    `;
}

</script>

</body>
</html>
